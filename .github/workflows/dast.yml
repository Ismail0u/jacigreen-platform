name: JACIGREEN DAST

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.4.0
        with:
          target: 'https://example.com'
          fail_action: false
